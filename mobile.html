<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prêts Festival</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0;--surf:#FFF;--surf2:#EFEDE8;--bord:#E0DDD6;
  --txt:#1A1916;--txt2:#6B6860;
  --acc:#2D5BE3;--acc-l:#EEF2FD;--acc-t:#1A3A9C;
  --ok:#1A7A4A;--ok-b:#E8F5EE;
  --warn:#8A5A00;--warn-b:#FFF4D6;
  --err:#C0392B;--err-b:#FDECEA;
  --r:12px;--rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;overflow-x:hidden;}
input,textarea{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important;}
button,.tile,.bi,.ch,.resp-btn,.dest-btn{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;}

/* HEADER */
.hdr{background:var(--surf);border-bottom:2px solid var(--bord);padding:0 14px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:100;gap:10px;}
.bico{width:34px;height:34px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bico svg{fill:white;width:18px;height:18px;}
.htitle{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.back-btn{display:none;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--r);border:2px solid var(--bord);background:var(--surf2);font-family:inherit;font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;white-space:nowrap;touch-action:manipulation;}
.back-btn.show{display:flex;}
.back-btn svg{width:16px;height:16px;fill:var(--txt);}

/* PAGES */
.pg{display:none;padding:12px 14px;min-height:calc(100vh - 52px);}
.pg.on{display:block;}

/* TUILES ACCUEIL */
.tiles{display:flex;flex-direction:column;gap:10px;padding-top:6px;}
.tile{display:flex;align-items:center;gap:14px;padding:18px 16px;background:var(--surf);border:2px solid var(--bord);border-radius:var(--rl);width:100%;font-family:inherit;text-align:left;}
.tile:active{background:var(--acc-l);border-color:var(--acc);}
.tile-ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;pointer-events:none;}
.tile-ico.blue{background:var(--acc-l);}
.tile-ico.green{background:var(--ok-b);}
.tile-ico.orange{background:var(--warn-b);}
.tile-title{font-size:17px;font-weight:700;color:var(--txt);pointer-events:none;}
.tile-desc{font-size:13px;color:var(--txt2);margin-top:2px;pointer-events:none;}
.tile-count{margin-left:auto;font-size:26px;font-weight:700;flex-shrink:0;pointer-events:none;}
.tile-count.warn{color:var(--warn);}
.tile-count.ok{color:var(--ok);}

/* STEPS */
.steps{display:flex;align-items:center;margin-bottom:14px;}
.stn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid var(--bord);color:var(--txt2);background:var(--surf);flex-shrink:0;}
.stp.on .stn{border-color:var(--acc);color:white;background:var(--acc);}
.stp.dn .stn{border-color:var(--ok);color:white;background:var(--ok);}
.ssep{flex:1;height:2px;background:var(--bord);margin:0 4px;}
.sp{display:none;}
.sp.on{display:block;}

/* FORMULAIRES */
.step-title{font-size:17px;font-weight:700;margin-bottom:12px;color:var(--txt);}
.fg{margin-bottom:10px;}
.fl{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
.fc{width:100%;padding:11px 12px;border:2px solid var(--bord);border-radius:var(--r);background:var(--surf);font-family:inherit;font-size:16px;color:var(--txt);outline:none;}
.fc:focus{border-color:var(--acc);}
.fsec{background:var(--surf2);border-radius:var(--r);padding:12px;margin-bottom:10px;border:2px solid var(--bord);}
.fst{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}

/* BOUTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;border-radius:var(--r);border:none;font-family:inherit;font-size:16px;font-weight:600;width:100%;margin-bottom:8px;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
.btn:last-child{margin-bottom:0;}
.btn:active{opacity:.85;}
.bp{background:var(--acc);color:white;}
.bs{background:var(--surf2);color:var(--txt);border:2px solid var(--bord);}
.bd{background:var(--err-b);color:var(--err);border:2px solid #F5B4B0;}
.bo{background:var(--ok-b);color:var(--ok);border:2px solid #A5DEC0;}
.btn-row{display:flex;gap:10px;margin-top:4px;}
.btn-row .btn{margin-bottom:0;}

/* LISTE BÉNÉVOLES */
.bl{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
.bi{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--bord);border-radius:var(--r);background:var(--surf);}
.bi.on{border-color:var(--acc);background:var(--acc-l);}
.bi:active{background:var(--acc-l);}
.bav{width:40px;height:40px;border-radius:50%;background:var(--acc-l);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--acc-t);flex-shrink:0;pointer-events:none;}
.bi-name{font-size:15px;font-weight:600;pointer-events:none;}
.bi-comm{font-size:12px;color:var(--txt2);margin-top:2px;pointer-events:none;}

/* RESPONSABLES */
.resp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.resp-btn{padding:10px 8px;border-radius:var(--r);border:2px solid var(--bord);background:var(--surf);font-family:inherit;font-size:15px;font-weight:600;color:var(--txt);text-align:center;}
.resp-btn.on{background:var(--acc);color:white;border-color:var(--acc);}
.resp-btn:active{opacity:.85;}

/* DESTOCKAGE */
.dest-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dest-btn{padding:12px;border-radius:var(--r);border:2px solid var(--bord);background:var(--surf);font-family:inherit;font-size:15px;font-weight:600;text-align:center;}
.dest-btn.on-non{background:var(--acc);color:white;border-color:var(--acc);}
.dest-btn.on-oui{background:var(--err);color:white;border-color:var(--err);}
.dest-btn:active{opacity:.85;}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;pointer-events:none;}
.bok{background:var(--ok-b);color:var(--ok);}
.berr{background:var(--err-b);color:var(--err);}
.bwarn{background:var(--warn-b);color:var(--warn);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}

/* CARTES PRÊTS */
.pc{background:var(--surf);border:2px solid var(--bord);border-radius:var(--rl);padding:12px;margin-bottom:10px;}
.pc-veh{font-weight:700;font-size:17px;margin-bottom:2px;}
.pc-sub{font-size:13px;color:var(--txt2);margin-bottom:6px;}
.pc-info{font-size:13px;color:var(--txt2);line-height:1.8;margin-bottom:10px;}
.pc-foot{display:flex;gap:8px;flex-wrap:wrap;}
.pc-foot .btn{width:auto;flex:1;margin-bottom:0;padding:12px 16px;font-size:15px;}

/* INFO BOX */
.ibox{padding:10px 14px;background:var(--acc-l);border-radius:var(--r);border:2px solid rgba(45,91,227,.2);font-size:14px;margin-bottom:10px;line-height:1.6;}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;}
.mo.hid{display:none;}
.md{background:var(--surf);border-radius:20px 20px 0 0;width:100%;padding:22px 18px;}
.mt{font-size:18px;font-weight:700;margin-bottom:10px;}
.mp{font-size:15px;color:var(--txt2);margin-bottom:4px;}
.mf{display:flex;gap:10px;margin-top:16px;}
.mf .btn{margin-bottom:0;}

/* DIVERS */
.emp{text-align:center;padding:30px 20px;color:var(--txt2);font-size:15px;}
.ld{display:inline-block;width:20px;height:20px;border:3px solid var(--bord);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.dm-box{display:none;padding:12px;border-radius:var(--r);margin-bottom:10px;font-size:14px;font-weight:500;}
.toast{position:fixed;bottom:20px;left:14px;right:14px;padding:14px 18px;border-radius:var(--r);font-size:15px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;background:var(--txt);color:white;text-align:center;}
.toast.on{opacity:1;transform:translateY(0);}
.toast.ok{background:var(--ok);}
.toast.err{background:var(--err);}
</style>
</head>
<body>
<div class="hdr">
  <button class="back-btn" id="back-btn">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Retour
  </button>
  <div class="bico" id="hdr-ico"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></div>
  <div class="htitle" id="hdr-title">Prêts Festival</div>
</div>

<!-- ACCUEIL -->
<div id="pg-home" class="pg on">
  <div class="tiles">
    <button class="tile" id="tile-veh">
      <div class="tile-ico blue">🚗</div>
      <div><div class="tile-title">Véhicules</div><div class="tile-desc">Voitures, chariots, engins</div></div>
      <div class="tile-count warn" id="cnt-veh"><div class="ld"></div></div>
    </button>
    <button class="tile" id="tile-mat">
      <div class="tile-ico orange">📦</div>
      <div><div class="tile-title">Matériel</div><div class="tile-desc">Outils, équipements, fournitures</div></div>
      <div class="tile-count warn" id="cnt-mat"><div class="ld"></div></div>
    </button>
  </div>
</div>

<!-- MENU -->
<div id="pg-menu" class="pg">
  <div class="tiles">
    <button class="tile" id="tile-list">
      <div class="tile-ico green">📋</div>
      <div><div class="tile-title">Prêts en cours</div><div class="tile-desc" id="menu-list-desc">Voir et terminer</div></div>
      <div class="tile-count warn" id="menu-cnt">—</div>
    </button>
    <button class="tile" id="tile-new">
      <div class="tile-ico blue">➕</div>
      <div><div class="tile-title">Nouveau prêt</div><div class="tile-desc" id="menu-new-desc">Créer un prêt</div></div>
    </button>
  </div>
</div>

<!-- LISTE VÉHICULES -->
<div id="pg-veh-list" class="pg">
  <div id="veh-list-content"><div class="emp"><div class="ld"></div></div></div>
</div>

<!-- NOUVEAU PRÊT VÉH -->
<div id="pg-veh-new" class="pg">
  <div class="steps">
    <div class="stp on" id="vsi0"><div class="stn">1</div></div><div class="ssep"></div>
    <div class="stp" id="vsi1"><div class="stn">2</div></div><div class="ssep"></div>
    <div class="stp" id="vsi2"><div class="stn">3</div></div><div class="ssep"></div>
    <div class="stp" id="vsi3"><div class="stn">4</div></div>
  </div>

  <!-- STEP 1 : véhicule -->
  <div class="sp on" id="vsp0">
    <div class="step-title">Numéro du véhicule</div>
    <div class="fg">
      <label class="fl">Numéro LNDE (1 à 68)</label>
      <input type="number" class="fc" id="veh-num" min="1" max="68" placeholder="Ex: 12" autocomplete="off" style="font-size:28px;text-align:center;padding:16px;">
    </div>
    <button class="btn bp" id="btn-veh-chercher">🔍 Rechercher</button>
    <div id="v-info" style="display:none;margin-top:10px;" class="ibox"></div>
    <div id="v-confirm" style="display:none;margin-top:6px;">
      <button class="btn bp" id="btn-vs1next">✔ Confirmer ce véhicule</button>
    </div>
    <div id="v-rechanger" style="display:none;margin-top:6px;">
      <button class="btn bs" id="btn-veh-rechanger">↩ Changer de numéro</button>
    </div>
  </div>

  <!-- STEP 2 : dates -->
  <div class="sp" id="vsp1">
    <div id="v-recap" class="ibox"></div>
    <div class="step-title">Dates du prêt</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="fsec" style="margin-bottom:0;">
        <div class="fst">Départ</div>
        <div class="fg"><label class="fl">Date</label><input type="date" class="fc" id="dd"></div>
        <div><label class="fl">Heure</label><input type="time" class="fc" id="hd"></div>
      </div>
      <div class="fsec" style="margin-bottom:0;">
        <div class="fst">Retour prévu</div>
        <div class="fg"><label class="fl">Date</label><input type="date" class="fc" id="dr"></div>
        <div><label class="fl">Heure</label><input type="time" class="fc" id="hr"></div>
      </div>
    </div>
    <div class="dm-box" id="dm"></div>
    <button class="btn bp" id="btn-chkdispo">Vérifier disponibilité</button>
    <button class="btn bp" id="btn-dispo-next" style="display:none">Suivant → Bénévole</button>
    <button class="btn bs" id="btn-vsp1-back">← Retour</button>
  </div>

  <!-- STEP 3 : bénévole -->
  <div class="sp" id="vsp2">
    <div class="step-title">Bénévole emprunteur</div>
    <div class="fg" style="display:flex;gap:8px;align-items:flex-end;">
      <div style="flex:1"><label class="fl">Nom ou prénom</label><input type="text" class="fc" id="sb" placeholder="5 lettres min." autocomplete="off"></div>
      <button class="btn bp" id="btn-sb-chercher" style="width:auto;padding:11px 16px;margin-bottom:0;">🔍</button>
    </div>
    <div class="bl" id="bl" style="display:none;"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn bs" id="btn-vsp2-back">← Retour</button>
      <button class="btn bp" id="btn-vs3next">Suivant →</button>
    </div>
  </div>

  <!-- STEP 4 : confirmation -->
  <div class="sp" id="vsp3">
    <div class="step-title">Confirmer le prêt</div>
    <div id="v-recap-final" class="ibox"></div>
    <div class="fg">
      <label class="fl">Qui fait ce prêt ?</label>
      <div class="resp-grid">
        <button class="resp-btn" id="resp-Tef">Tef</button>
        <button class="resp-btn" id="resp-Ced">Ced</button>
        <button class="resp-btn" id="resp-Chris">Chris</button>
        <button class="resp-btn" id="resp-Lorianne">Lorianne</button>
      </div>
    </div>
    <button class="btn bp" id="btn-valveh">✔ Valider le prêt</button>
    <button class="btn bs" id="btn-vsp3-back">← Retour</button>
  </div>
</div>

<!-- LISTE MATÉRIEL -->
<div id="pg-mat-list" class="pg">
  <div id="mat-list-content"><div class="emp"><div class="ld"></div></div></div>
</div>

<!-- NOUVEAU PRÊT MAT -->
<div id="pg-mat-new" class="pg">
  <div class="step-title">Nouveau prêt matériel</div>

  <!-- Zone recherche bénévole -->
  <div id="mb-search-zone">
    <div class="fg">
      <label class="fl">Bénévole emprunteur</label>
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <div style="flex:1"><input type="text" class="fc" id="mb-search" placeholder="2 lettres min." autocomplete="off"></div>
        <button class="btn bp" id="btn-mb-chercher" style="width:auto;padding:11px 16px;margin-bottom:0;">🔍</button>
      </div>
    </div>
    <div class="bl" id="mb-list" style="display:none;margin-top:8px;max-height:200px;overflow-y:auto;border:2px solid var(--bord);border-radius:var(--r);"></div>
  </div>

  <!-- Info bénévole sélectionné -->
  <div id="mb-info" style="display:none;margin-bottom:10px;" class="ibox"></div>

  <!-- Formulaire (masqué jusqu'à sélection bénévole) -->
  <div id="mb-form" style="display:none;">
    <div class="fg"><label class="fl">Désignation</label><input type="text" class="fc" id="mdesig" placeholder="Nom du matériel..." autocomplete="off"></div>
    <div class="fg"><label class="fl">Info complémentaire</label><input type="text" class="fc" id="minfo" placeholder="Optionnel..." autocomplete="off"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;">
      <div><label class="fl">Quantité</label><input type="number" class="fc" id="mqte" value="1" min="1"></div>
      <div>
        <label class="fl">Déstockage</label>
        <div class="dest-row" style="margin-top:6px;">
          <button class="dest-btn on-non" id="mdest-non">Non</button>
          <button class="dest-btn" id="mdest-oui">Oui</button>
        </div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Responsable de la saisie</label>
      <div class="resp-grid">
        <button class="resp-btn" id="mresp-Tef">Tef</button>
        <button class="resp-btn" id="mresp-Ced">Ced</button>
        <button class="resp-btn" id="mresp-Chris">Chris</button>
        <button class="resp-btn" id="mresp-Lorianne">Lorianne</button>
      </div>
    </div>
    <button class="btn bp" id="btn-valmat">✔ Enregistrer le prêt</button>
  </div>
</div>

<!-- MODAL -->
<div class="mo hid" id="modal">
  <div class="md">
    <div class="mt" id="m-title"></div>
    <div class="mp" id="m-body"></div>
    <div class="mf" id="m-foot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var API='https://prets-proxy.lemagasingue.workers.dev';

function apiGet(action,cb,err){
  fetch(API+'?'+action)
    .then(function(r){return r.json();}).then(cb)
    .catch(function(e){if(err)err(e);else toast('Erreur réseau','err');});
}
function apiPost(action,data,cb,err){
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,data:data})})
    .then(function(r){return r.json();}).then(cb)
    .catch(function(e){if(err)err(e);else toast('Erreur réseau','err');});
}

function onTap(el,fn){
  if(!el)return;
  var tapped=false;
  el.addEventListener('touchend',function(e){
    e.preventDefault();
    if(tapped)return;
    tapped=true;
    setTimeout(function(){tapped=false;},400);
    fn(e);
  },{passive:false});
  el.addEventListener('click',function(e){if(tapped)return;fn(e);});
}

var V=[],B=[],P=[],PM=[];
var selV=null,selB=null,selResp=null;
var selMBenv=null,selMResp=null,selDest='Non';
var curType=null,navStack=[];
var PAGES=['pg-home','pg-menu','pg-veh-list','pg-veh-new','pg-mat-list','pg-mat-new'];

window.onload=function(){initDates();bindAll();loadAll();};

function pad(n){return n<10?'0'+n:String(n);}
function initDates(){
  var n=new Date(),r=new Date(n.getTime()+3600000);
  var td=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
  document.getElementById('dd').value=td;
  document.getElementById('hd').value=pad(n.getHours())+':'+pad(n.getMinutes());
  document.getElementById('dr').value=td;
  document.getElementById('hr').value=pad(r.getHours())+':'+pad(r.getMinutes());
}

function bindAll(){
  onTap(document.getElementById('back-btn'),function(){goBack();});
  onTap(document.getElementById('tile-veh'),function(){goType('veh');});
  onTap(document.getElementById('tile-mat'),function(){goType('mat');});
  onTap(document.getElementById('tile-list'),function(){goAction('list');});
  onTap(document.getElementById('tile-new'),function(){goAction('new');});
  onTap(document.getElementById('btn-veh-chercher'),function(){chercherVeh();});
  onTap(document.getElementById('btn-veh-rechanger'),function(){rechangerVeh();});
  onTap(document.getElementById('btn-vs1next'),function(){vs1next();});
  onTap(document.getElementById('btn-chkdispo'),function(){chkDispo();});
  onTap(document.getElementById('btn-dispo-next'),function(){vgos(2);});
  onTap(document.getElementById('btn-vsp1-back'),function(){vgos(0);});
  onTap(document.getElementById('btn-sb-chercher'),function(){chercherBenv();});
  onTap(document.getElementById('btn-vs3next'),function(){vs3next();});
  onTap(document.getElementById('btn-vsp2-back'),function(){vgos(1);});
  onTap(document.getElementById('btn-valveh'),function(){validerVeh();});

function dispo(v){
  var vid=String(v.VehiculeID||'').trim(),plaque=String(v.Plaque||'').trim(),lnde=String(v['NuméroLNDE']||v.NumeroLNDE||'').trim();
  for(var i=0;i<P.length;i++){
    if(String(P[i].Statut||'').trim()!=='En cours')continue;
    var pvid=String(P[i].VehiculeID||'').trim(),ppl=String(P[i].Plaque||'').trim(),plnd=String(P[i].NumeroLNDE||'').trim();
    if(vid&&pvid&&vid===pvid)return false;
    if(plaque&&ppl&&plaque===ppl)return false;
    if(lnde&&plnd&&lnde===plnd)return false;
  }
  return true;
}

function chercherVeh(){
  var num=String(document.getElementById('veh-num').value).trim();
  document.getElementById('veh-num').blur();
  if(!num){toast('Saisissez un numéro','err');return;}
  var n=parseInt(num);
  if(isNaN(n)||n<1||n>68){toast('Numéro entre 1 et 68','err');return;}
  var found=null;
  for(var i=0;i<V.length;i++){
    var lnde=String(V[i]['NuméroLNDE']||V[i].NumeroLNDE||'').trim();
    if(parseInt(lnde)===n){found=V[i];break;}
  }
  if(!found){toast('Véhicule '+n+' introuvable','err');return;}
  var d=dispo(found);
  var lnde=found['NuméroLNDE']||found.NumeroLNDE||'';
  var box=document.getElementById('v-info');
  box.style.display='block';
  if(!d){
    box.innerHTML='<span style="color:var(--err);font-weight:700;">⚠ Véhicule '+lnde+' indisponible</span><br>'+(found.Type||'')+(found.Plaque?' · '+found.Plaque:'');
    document.getElementById('v-confirm').style.display='none';
    document.getElementById('v-rechanger').style.display='block';
    selV=null;
  } else {
    box.innerHTML='<strong>Véhicule '+lnde+'</strong>'+(found.Type?' — '+found.Type:'')+(found.Plaque?' &nbsp;·&nbsp; '+found.Plaque:'')+(found.Carburant?' &nbsp;·&nbsp; '+found.Carburant:'');
    document.getElementById('v-confirm').style.display='block';
    document.getElementById('v-rechanger').style.display='none';
    document.getElementById('veh-num').style.display='none';
    document.getElementById('btn-veh-chercher').style.display='none';
    selV=found;
  }
}

  },50);
}

function oMod(t,b,f){document.getElementById('m-title').textContent=t;document.getElementById('m-body').innerHTML=b;document.getElementById('m-foot').innerHTML=f;document.getElementById('modal').className='mo';}
function cMod(){document.getElementById('modal').className='mo hid';}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast on'+(type?' '+type:'');setTimeout(function(){t.className='toast';},3000);}
</script>
