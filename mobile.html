<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prêts Festival</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'DM Sans',sans-serif;}
body{background:#F5F4F0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.wrap{width:100%;max-width:400px;}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;}
.bico{width:52px;height:52px;background:#2D5BE3;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bico svg{fill:white;width:28px;height:28px;}
.logo-txt{font-size:22px;font-weight:700;color:#1A1916;}
.sub{text-align:center;font-size:16px;color:#6B6860;margin-bottom:32px;}
.choices{display:flex;flex-direction:column;gap:16px;}
.btn{display:flex;align-items:center;gap:20px;padding:26px 24px;background:white;border:2px solid #E0DDD6;border-radius:20px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s;width:100%;}
.btn:active,.btn:hover{border-color:#2D5BE3;background:#EEF2FD;}
.btn-ico{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.btn-ico.blue{background:#EEF2FD;}
.btn-ico.green{background:#E8F5EE;}
.btn-title{font-size:20px;font-weight:700;color:#1A1916;margin-bottom:4px;}
.btn-desc{font-size:14px;color:#6B6860;}
.arrow{margin-left:auto;font-size:22px;color:#9B9890;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="bico"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></div>
    <div class="logo-txt">Prêts Festival</div>
  </div>
  <div class="sub">Choisissez votre interface</div>
  <div class="choices">
    <a class="btn" href="https://script.google.com/macros/s/AKfycbwC_6E4azD6ogRh-_hEm_xE8dl4NrcFdVkcXQL-RGiQpvy92gRztrtCOkNx-Sjxd3Fx/exec?mode=desktop">
      <div class="btn-ico blue">🖥️</div>
      <div>
        <div class="btn-title">Version PC</div>
        <div class="btn-desc">Tableaux, signature Wacom, grand écran</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="btn" href="./mobile.html">
      <div class="btn-ico green">📱</div>
      <div>
        <div class="btn-title">Version Mobile</div>
        <div class="btn-desc">Interface tactile, grands boutons</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>
</div>
</body>
</html>
